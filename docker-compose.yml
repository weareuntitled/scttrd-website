services:
  web:
    build: .
    ports:
      - "4321:4321"
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
      - /app/.astro
    command: npm run dev -- --host 0.0.0.0 --port 4321
  cms:
    build: ./cms
    ports:
      - "3000:3000"
    env_file: ./cms/.env
    command: npm run dev
