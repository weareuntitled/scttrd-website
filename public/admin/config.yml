locale: de

backend:
  name: proxy
  proxy_url: http://localhost:8081/api/v1
  branch: main

media_folder: public/images
public_folder: /images
publish_mode: simple
site_url: https://scttrd.de
display_url: https://scttrd.de
logo_url: /images/Frame-179-2.png
editorial_workflow: false

collections:
  - name: homepage
    label: "Startseite"
    files:
      - label: "Texte · Bio · CTA"
        name: texts
        file: src/content/home/text.md
        fields:
          - { label: Headline (groß SCTTRD), name: headline, widget: string, default: SCTTRD }
          - { label: Titel, name: title, widget: string, required: false, hint: "Browser-Titel, z.B. LIVE Techno mit Vocals" }
          - { label: Untertitel, name: subtitle, widget: string, required: false }
          - { label: Bio (deutsch), name: bio_de, widget: text, required: false, hint: "Wird auf der Startseite unter 'Punk, aber schön' angezeigt" }
          - { label: Bio (englisch), name: bio_en, widget: text, required: false }
          - { label: Kurztext (Claim), name: text, widget: text, required: false, hint: "z.B. Punk, aber schön" }
          - { label: E-Mail (Header & Footer), name: email, widget: string, hint: "info@scttrd.de" }
          - { label: CTA-Headline, name: cta_headline, widget: string, required: false, hint: "Want to book us?" }
          - { label: CTA-Button Text, name: cta_button, widget: string, required: false }
          - { label: CTA-Mail-Betreff, name: cta_button_email_subject, widget: string, required: false }

      - label: "Hero-Bilder"
        name: images
        file: src/content/home/images.md
        fields:
          - { label: Hero-Bild links (groß), name: heroImage1, widget: image, choose_url: true, hint: "Idealerweise 1536×2304, z.B. about_04.jpg" }
          - { label: Beschreibung Bild 1, name: heroImage1Alt, widget: string, required: false }
          - { label: Hero-Bild rechts (30% kleiner), name: heroImage2, widget: image, choose_url: true, hint: "z.B. about_01.jpg" }
          - { label: Beschreibung Bild 2, name: heroImage2Alt, widget: string, required: false }

  - name: shows
    label: "Termine"
    label_singular: "Termin"
    folder: src/content/home/shows
    create: true
    slug: "{{slug}}"
    format: frontmatter
    fields:
      - { label: Status, name: status, widget: select, options: [upcoming, past], hint: "upcoming = oben, past = unten" }
      - { label: Titel / Venue, name: venue, widget: string, hint: "z.B. singoldsand" }
      - { label: Stadt, name: city, widget: string }
      - { label: Datum, name: date, widget: datetime, date_format: 'DD.MM.YYYY', time_format: false, picker_utc: false }
      - { label: Bild, name: image, widget: image, choose_url: true }
      - { label: Bildbeschreibung, name: imageAlt, widget: string, required: false }
      - { label: Externer Link (YouTube etc.), name: link, widget: string, required: false }
      - { label: Reihenfolge, name: order, widget: number, value_type: int, default: 10, hint: "Bei gleichem Datum: kleinere Zahl = weiter oben" }

  - name: about
    label: "Über uns"
    files:
      - label: "Hero"
        name: hero
        file: src/content/about/hero.md
        fields:
          - { label: Überschrift, name: heading, widget: string }
          - { label: Untertitel, name: subheading, widget: string }
          - { label: Bio (englisch), name: bio_en, widget: text }
          - { label: E-Mail, name: email, widget: string }

      - label: "Galerie"
        name: gallery
        file: src/content/about/images.md
        fields:
          - { label: Hero-Bild, name: heroImage, widget: image, choose_url: true, required: false }
          - { label: Hero-Bild Beschreibung, name: heroImageAlt, widget: string, required: false }
          - label: Galerie
            name: gallery
            widget: list
            hint: "Bilder für /about – jeweils /images/..."
            fields:
              - { label: Bild, name: gallery, widget: image }

  - name: contact
    label: "Kontakt"
    files:
      - label: "Kontakt"
        name: contact
        file: src/content/contact/contact.md
        fields:
          - { label: E-Mail, name: email, widget: string }
          - { label: Adresse, name: address, widget: string }
          - { label: Text, name: text, widget: text }
          - { label: Instagram-URL, name: instagram_url, widget: string }
          - { label: Instagram-Handle, name: instagram_handle, widget: string }

  - name: links
    label: "Social Links"
    label_singular: "Link"
    folder: src/content/home/links
    create: true
    slug: "{{slug}}"
    format: frontmatter
    fields:
      - { label: Plattform, name: platform, widget: string, hint: "z.B. Spotify" }
      - { label: Anzeigename, name: label, widget: string }
      - { label: URL, name: url, widget: string }
      - { label: Reihenfolge, name: order, widget: number, value_type: int, default: 10 }

  - name: videos
    label: "CTA Video"
    label_singular: "Video"
    folder: src/content/home/videos
    create: true
    slug: "{{slug}}"
    format: frontmatter
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Posterbild, name: poster, widget: image, choose_url: true }
      - { label: Videodatei, name: video, widget: file, choose_url: true }
      - { label: Reihenfolge, name: order, widget: number, value_type: int, default: 10 }

  - name: press
    label: "Presse"
    label_singular: "Presseartikel"
    folder: src/content/home/press
    create: true
    slug: "{{slug}}"
    format: frontmatter
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Cover, name: cover, widget: image, choose_url: true }
      - { label: Externer Link, name: link, widget: string }
      - { label: Datum, name: date, widget: datetime, date_format: 'DD.MM.YYYY', time_format: false, picker_utc: false }

  - name: reels
    label: "Bento Videos"
    label_singular: "Reel"
    folder: src/content/home/reels
    create: true
    slug: "{{slug}}"
    format: frontmatter
    fields:
      - { label: Titel, name: title, widget: string, hint: "z.B. Wurzi – Take 1" }
      - { label: Videodatei, name: video, widget: file, choose_url: true }
      - { label: Posterbild, name: poster, widget: image, choose_url: true, required: false }
      - { label: Reihenfolge, name: order, widget: number, value_type: int, default: 10, hint: "1–3 werden in der Bento-Reihe angezeigt" }
